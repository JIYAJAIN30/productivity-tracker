<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A simple productivity tracker to manage tasks, track progress, and improve daily productivity.">
    <meta name="keywords" content="Productivity Tracker, Todo List, Task Manager, Productivity, Time Management">
    <meta name="author" content="JIYAJAIN30">

    <title>Productivity Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📚 Productivity Tracker</h1>

        <!-- Task Input -->
        <input type="text" id="taskInput" placeholder="Enter your task">
        <button onclick="addTask()">Add</button>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Progress -->
        <h3 id="progress">Progress: 0% (0/0 tasks completed)</h3>

        <!-- Timer -->
        <div class="timer">
            <h2 id="time">00:00:00</h2>
            <button onclick="startTimer()">Start</button>
            <button onclick="stopTimer()">Stop</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
