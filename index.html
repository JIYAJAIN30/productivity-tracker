<!DOCTYPE html>
<html lang="en">

<head>
    <title>Productivity Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>📚 Productivity Tracker</h1>

        <!-- Task Input -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Enter your task" autocomplete="off">
            <select id="categoryInput">
        <option value="General">General</option>
        <option value="Work">Work</option>
        <option value="Study">Study</option>
    </select>
            <button onclick="addTask()">Add</button>
        </div>

        <div class="filter-buttons" style="margin: 10px 0;">
            <button onclick="filterTasks('All')">All</button>
            <button onclick="filterTasks('Work')">Work</button>
            <button onclick="filterTasks('Study')">Study</button>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Progress -->
        <h3 id="progress">Progress: 0% (0/0 tasks completed)</h3>

        <!-- Timer -->
        <div class="timer">
            <h2 id="time">00:00:00</h2>
            <button onclick="startTimer()">Start</button>
            <button onclick="stopTimer()">Stop</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
