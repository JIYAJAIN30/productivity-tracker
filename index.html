<!DOCTYPE html>
<html lang="en">
<head>
    <title>Productivity Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="icon">⊞</span>
            <div>
                <h1>Productivity Tracker</h1>
                <p>Track your tasks and focus time</p>
            </div>
        </div>

        <div class="body">
            <!-- Task Input -->
            <div class="input-row">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button onclick="addTask()">+ Add</button>
            </div>

            <!-- Progress -->
            <div class="progress-section">
                <div class="progress-top">
                    <span>Progress</span>
                    <span id="progressCount" class="progress-count">0 / 0 tasks</span>
                </div>
                <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-pct" id="progress">0% complete</div>
            </div>

            <!-- Task List -->
            <ul id="taskList"></ul>

            <!-- Timer -->
            <div class="timer">
                <span>⏱ Focus Timer</span>
                <h2 id="time">00:00:00</h2>
                <div class="timer-btns">
                    <button class="btn-start" onclick="startTimer()">▶ Start</button>
                    <button class="btn-stop" onclick="stopTimer()">■ Stop</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
