<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'self'"
    >
    <title>Productivity Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📚 Productivity Tracker</h1>

        <!-- Task Input -->
        <input type="text" id="taskInput" placeholder="Enter your task">
        <button type="button" id="addTaskButton">Add</button>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Progress -->
        <h3 id="progress">Progress: 0% (0/0 tasks completed)</h3>

        <!-- Timer -->
        <div class="timer">
            <h2 id="time">00:00:00</h2>
            <button type="button" id="startTimerButton">Start</button>
            <button type="button" id="stopTimerButton">Stop</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
